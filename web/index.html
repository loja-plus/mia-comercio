<!DOCTYPE html>
<html lang="pt">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Loja+ — stock, vendas, contas e lembretes.">
  <meta name="theme-color" content="#123A30">

  <!-- iPad / iPhone: abrir como app a partir do ecrã principal -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Loja+">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Loja+</title>
  <style>
    html, body { margin: 0; height: 100%; background: #123A30; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; font: 600 20px -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .02em; }
  </style>
</head>
<body>
  <div id="loading">Loja+…</div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Funciona sem internet: guarda a app no aparelho depois da primeira abertura.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('mia_sw.js').catch(function () {});
      });
    }
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loading'); if (l) l.remove();
    });
  </script>
</body>
</html>
