name: loja_plus
description: Loja+ — gestão de stock, vendas, contas e lembretes para lojas.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase (plano gratuito Spark): login, base de dados sincronizada (funciona offline)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0

  # Alertas no próprio aparelho (validade, pagamentos) à data e hora certas
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  provider: ^6.1.2
  intl: any # a versão é fixada pelo Flutter
  fl_chart: ^0.69.0
  mobile_scanner: ^5.2.3
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3

  # Cópia de segurança em Excel
  excel: ^4.0.6
  file_saver: ^0.2.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
